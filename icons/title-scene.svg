<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" fill="none">
  <title>A little cat. A mighty quest.</title>
  <desc>Koshi, a heroic grey tabby with a white nose stripe, stands on his two back paws, holding a shining sword in one front paw with the other on his hip. His tail curls behind his body. A red-eyed Robo Mouse and an armored Robo Wheel glare at him among green, blue, and red bricks.</desc>
