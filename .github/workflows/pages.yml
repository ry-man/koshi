name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Stage static site
        run: |
          mkdir _site
          cp index.html editor.html style.css editor.css manifest.webmanifest sw.js _site/
          cp -r src icons fonts _site/
          # A new cache name per commit makes installed apps pick up each deploy.
          sed -i "s/const VERSION = 'koshi-dev';/const VERSION = 'koshi-${GITHUB_SHA}';/" _site/sw.js
          grep -q "koshi-${GITHUB_SHA}" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
